name: CI

# Only what Netlify does not do: Netlify builds master on merge and a deploy
# preview for every pull request (netlify.toml); no Hugo step here.
#   1. front matter: every content/post/*/index.md has title, date, summary,
#      draft; a post with a ```mermaid block needs diagram: true in params.yaml
#   2. forbidden words on the files under content/ this PR (or push) adds or
#      changes — public list scripts/forbidden-words.txt, private list in the
#      repository secret POST_FORBIDDEN_WORDS (optional, never printed).
#   3. public links only: every URL in a changed post answers 2xx to an
#      anonymous curl, and a GitHub link into hedata/<repo> names a repo
#      listed in scripts/public-repos.txt
#   4. at least one diagram or picture in every changed post
#   5. a featured image with its source (featured.mmd / .svg / .source.md)
#      in every changed post's folder
# Details: AGENTS.md, "CI".

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs the base branch and the pushed range
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests of the checks
        run: node --test "scripts/test/*.test.js"
      - name: Front matter
        run: node scripts/check-front-matter.js
      - name: Which posts this change touches
        # The gates below look only at what the PR (or push) adds or changes.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "CHANGED=--base origin/$GITHUB_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "CHANGED=--range $BEFORE..$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
        env:
          BEFORE: ${{ github.event.before }}
      - name: Forbidden words on changed posts
        run: node scripts/check-forbidden-words.js $CHANGED
        env:
          POST_FORBIDDEN_WORDS: ${{ secrets.POST_FORBIDDEN_WORDS }}
      - name: Public links only
        run: node scripts/check-links.js $CHANGED
      - name: At least one diagram or picture
        run: node scripts/check-diagram-or-picture.js $CHANGED
      - name: Featured image with its source
        run: node scripts/check-featured-image.js $CHANGED
